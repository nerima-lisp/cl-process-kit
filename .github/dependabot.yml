version: 2
updates:
  # Workflow files under .github/workflows/. Dependabot bumps the pinned action
  # SHAs and keeps the "# vN" comment in sync.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # The composite action pins its own tool versions in action.yml and needs a
  # dedicated directory entry to be tracked.
  - package-ecosystem: github-actions
    directory: /.github/actions/nix-setup
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
