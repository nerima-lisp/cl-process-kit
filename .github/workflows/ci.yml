name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17

      - name: Configure Cachix
        if: ${{ vars.CACHIX_CACHE != '' }}
        uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake
        # --max-jobs 1: checkout-tests and pty-tests both spawn real
        # subprocesses and drain their output on background threads with
        # tight timeouts; building them concurrently on a shared runner
        # starves those threads of CPU and makes the drain-timeout fallback
        # path flake under contention that a quieter host doesn't hit.
        run: nix flake check --print-build-logs --max-jobs 1
